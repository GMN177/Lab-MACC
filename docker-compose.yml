services:
  mongodb:
    container_name: "MongoDb"
    image: "mongo:4.4.18"
    ports:
      - 27017:27017
    volumes:
      - "./db:/data/db"
    restart: unless-stopped
  server:
    container_name: "Server"
    env_file: .env
    build:
      context: ./
    ports:
      - "4000:4000"
    restart: unless-stopped
    depends_on:
      - mongodb
    command: "npm run start"
